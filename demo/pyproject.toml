[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-v0-review"
version = "0.0.1"
description = "Independent acceptance build for the Codex team game v0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "Pillow>=11,<13",
  "pydantic>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "tzdata>=2025.1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["codex_v0*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
